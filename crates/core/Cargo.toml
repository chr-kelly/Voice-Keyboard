[package]
name = "voice-keyboard-core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "voice_keyboard_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "=0.29.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.16", features = ["v4", "serde"] }
base64 = "=0.22.1"
sha2 = "=0.10.8"
hmac = "=0.12.1"
snow = "=0.9.6"
x25519-dalek = "=2.0.1"
zeroize = "1.8"
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.20"
